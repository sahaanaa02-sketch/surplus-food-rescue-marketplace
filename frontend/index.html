<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroWasteBite | Surplus Food Rescue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b1210; color: #e8f5ec; font-family: Inter, system-ui, "Segoe UI", sans-serif; line-height: 1.5; }
      a { color: inherit; }
      input, select, button, textarea { font-family: inherit; font-size: 15px; }
      input::placeholder { color: #5f7a6c; }
      button:disabled { cursor: not-allowed; }
      img { max-width: 100%; }
      h1, h2, h3 { line-height: 1.2; }

      .lift { transition: transform .25s, border-color .25s, box-shadow .25s; }
      .lift:hover { transform: translateY(-4px); border-color: #22c55e88; box-shadow: 0 14px 34px #0009; }
      @keyframes fl { 0%,100% { transform: translateY(0) rotate(var(--r,0deg)); } 50% { transform: translateY(-14px) rotate(var(--r,0deg)); } }
      .float { animation: fl 5s ease-in-out infinite; }

      .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: center; }
      .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 22px; }
      .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
      .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
      .auth-grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 640px; }
      .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
      .chips button { white-space: nowrap; }
      .table-wrap { overflow-x: auto; }
      .nav-inner { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }

      @media (max-width: 900px) {
        .hero-grid, .two-col, .auth-grid { grid-template-columns: 1fr; }
        .hero-art, .hide-md { display: none !important; }
        .form-grid { grid-template-columns: repeat(2, 1fr); }
        .stat-grid { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 560px) {
        .form-grid { grid-template-columns: 1fr; }
        .cards-grid { grid-template-columns: 1fr; }
        .nav-inner { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
